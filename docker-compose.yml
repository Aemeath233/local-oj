services:
  mysql:
    image: mysql:8.4
    container_name: localoj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localoj_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-local_oj}
      MYSQL_USER: ${MYSQL_USER:-localoj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localoj_pass}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-127.0.0.1:3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-localoj}", "-p${MYSQL_PASSWORD:-localoj_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: localoj-redis
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  go-judge:
    build:
      context: ./docker/go-judge
    container_name: localoj-go-judge
    privileged: true
    shm_size: 256m
    ports:
      - "${GO_JUDGE_PORT:-127.0.0.1:5050}:5050"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: localoj-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-local_oj}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-localoj}
      DB_PASSWORD: ${DB_PASSWORD:-localoj_pass}
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-internal-secret-at-least-32-bytes}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://192.168.0.74:5173}
      GO_JUDGE_BASE_URL: ${GO_JUDGE_BASE_URL:-http://go-judge:5050}
      APP_DATA_ROOT: ${APP_DATA_ROOT:-/data}
      JUDGE_QUEUE_KEY: ${JUDGE_QUEUE_KEY:-judge:queue}
      JUDGE_PROCESSING_KEY: ${JUDGE_PROCESSING_KEY:-judge:processing}
      JUDGE_DLQ_KEY: ${JUDGE_DLQ_KEY:-judge:dlq}
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - oj-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge-worker:
    build:
      context: .
      dockerfile: judge-worker/Dockerfile
    container_name: localoj-judge-worker
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-local_oj}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-localoj}
      DB_PASSWORD: ${DB_PASSWORD:-localoj_pass}
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GO_JUDGE_BASE_URL: http://go-judge:5050
      APP_DATA_ROOT: ${APP_DATA_ROOT:-/data}
      JUDGE_QUEUE_KEY: ${JUDGE_QUEUE_KEY:-judge:queue}
      JUDGE_PROCESSING_KEY: ${JUDGE_PROCESSING_KEY:-judge:processing}
      JUDGE_DLQ_KEY: ${JUDGE_DLQ_KEY:-judge:dlq}
    volumes:
      - oj-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-judge:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: localoj-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  oj-data:
