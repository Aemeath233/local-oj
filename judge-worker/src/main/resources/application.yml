spring:
  application:
    name: coderush-oj-judge-worker
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coderush_oj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:coderushoj}
    password: ${DB_PASSWORD:coderushoj_pass}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  worker:
    id: ${APP_WORKER_ID:}
  queue:
    submission-key: ${JUDGE_QUEUE_KEY:judge:queue}
    processing-key: ${JUDGE_PROCESSING_KEY:judge:processing}
    dlq-key: ${JUDGE_DLQ_KEY:judge:dlq}
  go-judge:
    base-url: ${GO_JUDGE_BASE_URL:http://localhost:5050}
    connect-timeout-ms: ${GO_JUDGE_CONNECT_TIMEOUT_MS:5000}
    # Read timeout must be larger than go-judge's maximum possible clockLimit (compile clockLimit = compileTimeoutMs * 2 + 1000ms = 241000ms)
    read-timeout-ms: ${GO_JUDGE_READ_TIMEOUT_MS:300000}
  data-root: ${APP_DATA_ROOT:/data}

worker:
  poll-delay-ms: ${WORKER_POLL_DELAY_MS:300}

logging:
  file:
    name: ${APP_DATA_ROOT:/data}/logs/judge-worker.log
