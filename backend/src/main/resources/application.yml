server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: local-oj-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/local_oj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:localoj}
    password: ${DB_PASSWORD:localoj_pass}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    validate-on-migrate: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-internal-secret-at-least-32-bytes}
    ttl-minutes: ${JWT_TTL_MINUTES:10080}
  queue:
    submission-key: ${JUDGE_QUEUE_KEY:judge:queue}
    dlq-key: ${JUDGE_DLQ_KEY:judge:dlq}
  go-judge:
    base-url: ${GO_JUDGE_BASE_URL:http://localhost:5050}
  data-root: ${APP_DATA_ROOT:/data}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173}
  contests:
    visibility-release-delay-ms: ${CONTEST_VISIBILITY_RELEASE_DELAY_MS:60000}

logging:
  file:
    name: ${APP_DATA_ROOT:/data}/logs/backend.log
